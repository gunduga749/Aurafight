<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Batalla de Auras Arena</title>
<link rel="stylesheet" href="style.css"></head><body>
<div id="st">
<img id="bg" src="img/fondo.jpg" alt="">
<div class="aura" id="aP"></div><div class="aura" id="aE"></div>
<div class="sh" id="s0"></div><div class="sh" id="s1"></div>
<canvas id="fx"></canvas>
<img id="spr" src="img/guerrera.png" alt="">
<div id="fl"></div>
<div id="top">
<div class="hud"><img class="em" src="img/emblema-jugador.jpg" alt=""><div class="bars"><b>JUGADOR</b><div class="hp"><i id="h0"></i><span id="t0"></span></div><div class="en" id="e0"></div></div></div>
<div id="mid"><h1>BATALLA DE AURAS ARENA</h1><small id="turn"></small></div>
<div class="hud e"><img class="em" src="img/emblema-oponente.jpg" alt=""><div class="bars"><b>OPONENTE</b><div class="hp"><i id="h1"></i><span id="t1"></span></div><div class="en" id="e1"></div></div></div>
</div>
<div id="msg"></div>
<div id="pan"><div id="sk"></div><div id="inf"></div><button id="go" disabled>ATACAR</button></div>
<div id="end"><h2></h2><button id="again">JUGAR DE NUEVO</button></div>
</div>
<p id="rot">Gira el móvil para jugar en horizontal</p>
<script src="game.js"></script></body></html>
